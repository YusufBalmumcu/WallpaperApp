<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Waves</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a0f1f}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, t = 0;
function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
addEventListener('resize', resize); resize();

const layers = [
  { amp: 0.10, len: 0.0016, sp: 0.6, y: 0.78, hue: 215 },
  { amp: 0.08, len: 0.0022, sp: 0.9, y: 0.84, hue: 190 },
  { amp: 0.06, len: 0.0030, sp: 1.3, y: 0.90, hue: 265 },
];

function frame(){
  t += 0.005;
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0f1f'); g.addColorStop(1, '#13203f');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  for (const L of layers){
    x.beginPath();
    x.moveTo(0, H);
    for (let px = 0; px <= W; px += 6){
      const y = H * L.y + Math.sin(px * L.len + t * L.sp) * H * L.amp
                        + Math.sin(px * L.len * 2.3 + t * L.sp * 1.7) * H * L.amp * 0.4;
      x.lineTo(px, y);
    }
    x.lineTo(W, H); x.closePath();
    const lg = x.createLinearGradient(0, H * (L.y - L.amp), 0, H);
    lg.addColorStop(0, `hsla(${L.hue},80%,60%,0.55)`);
    lg.addColorStop(1, `hsla(${L.hue},80%,40%,0.15)`);
    x.fillStyle = lg; x.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
