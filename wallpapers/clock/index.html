<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gradient Clock</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #bg{position:fixed;inset:0;background:linear-gradient(120deg,#1a1442,#3a1c6e,#0f2a52,#11385e);
      background-size:400% 400%;animation:flow 48s ease infinite}
  @keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  #time{font-size:13vw;font-weight:700;letter-spacing:.02em;text-shadow:0 6px 40px rgba(0,0,0,.45)}
  #date{font-size:2.4vw;font-weight:300;opacity:.85;margin-top:.2em}
</style></head>
<body>
<div id="bg"></div>
<div class="wrap"><div id="time">00:00</div><div id="date"></div></div>
<script>
const T = document.getElementById('time'), D = document.getElementById('date');
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function tick(){
  const d = new Date();
  T.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  D.textContent = d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
tick(); setInterval(tick, 1000);
</script></body></html>
